<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <title>Redeem a Date</title>
    <meta name="description" content="Scratch one off to redeem a date with me." />

    <!--
      Open Graph + Twitter Card tags: this is what iMessage, Slack,
      etc. actually read to build a link-preview card — the <title>
      tag above is not enough on its own. og:image must be an absolute
      URL (crawlers won't resolve a relative one against this page).
      Image lives at public/og-image.jpg — see docs/SPEC.md "Share
      link preview" for how it was made and how to regenerate it.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://secret-date-card.netlify.app/" />
    <meta property="og:title" content="Secret Date Nite?" />
    <meta property="og:description" content="Scratch one off to redeem a date with me." />
    <meta property="og:image" content="https://secret-date-card.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Secret Date Nite?" />
    <meta name="twitter:description" content="Scratch one off to redeem a date with me." />
    <meta name="twitter:image" content="https://secret-date-card.netlify.app/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Static, hidden, and outside #root on purpose: Netlify discovers
      forms by parsing the *built* HTML at deploy time, before any JS
      runs, so a form only ever rendered by React would never be
      registered. This one is never actually submitted by a browser —
      src/lib/notifyScratched.ts POSTs to it via fetch() at runtime.
      Field names here must match the URLSearchParams keys there.
      See docs/SPEC.md "Scratch notification email".
    -->
    <form name="scratch-reveal" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="id" />
      <input type="text" name="title" />
      <input type="text" name="when" />
    </form>
  </body>
</html>
